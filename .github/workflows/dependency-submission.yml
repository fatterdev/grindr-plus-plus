name: Dependency Submission

# Curated Gradle dependency graph: only the delivery flavors' runtime
# classpaths, so Dependabot alerts reflect shipped code.
# Build/plugin tooling classpaths (AGP, bundletool, UTP → grpc/netty, ...) and
# test-only configurations are intentionally excluded.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph-include-configurations: '(morphe|alloy|embed)(Debug|Release)RuntimeClasspath'
